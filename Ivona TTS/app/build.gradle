plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivona.tts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ivona.tts'
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName '2.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        fantasma {
            storeFile file(System.getenv('IVONA_KS') ?: 'sin_llave.jks')
            storePassword System.getenv('IVONA_KS_PASS')
            keyAlias 'fantasma'
            keyPassword System.getenv('IVONA_KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fantasma
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
