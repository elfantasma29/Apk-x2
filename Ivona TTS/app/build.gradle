plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivona.tts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ivona.tts'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
