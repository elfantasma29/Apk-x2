plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivona.tts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ivona.tts'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0-prototipo'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        fantasma {
            def ruta = System.getenv('IV_KEYSTORE')
            if (ruta != null) {
                storeFile file(ruta)
                storePassword System.getenv('IV_PASS')
                keyAlias System.getenv('IV_ALIAS') ?: 'fantasma'
                keyPassword System.getenv('IV_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('IV_KEYSTORE') != null) {
                signingConfig signingConfigs.fantasma
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
