plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivona.tts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ivona.tts'
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName '0.3.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        fantasma {
            storeFile rootProject.file('firma/ivona_prueba.jks')
            storePassword 'ivonaprueba'
            keyAlias 'fantasma'
            keyPassword 'ivonaprueba'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fantasma
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
